name: CI

on:
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/**"

permissions:
  contents: read

# One run per PR; a new push supersedes the old in-flight run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: landing
    env:
      # Job-level env so step `if` can test for the secret. Empty on fork PRs.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: landing/.nvmrc
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Uploads a preview version of the Worker (no deploy to production).
      # Skipped on fork PRs: GitHub does not expose secrets to them, and
      # the fork check avoids a confusing "missing token" failure.
      - name: Upload preview version
        if: github.event.pull_request.head.repo.full_name == github.repository && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" --preview-alias "pr-${{ github.event.pull_request.number }}"
