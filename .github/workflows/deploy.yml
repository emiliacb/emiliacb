name: Deploy

on:
  push:
    branches:
      - master
    paths:
      - "landing/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys instead of cancelling: a cancelled deploy can leave the
# Worker half-updated, so the in-flight run always finishes first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: landing/.nvmrc
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # No wranglerVersion: the action reuses the wrangler already installed by
      # `npm ci`, so the deploy always matches package-lock.json.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing
          command: deploy
